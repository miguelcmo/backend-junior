<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulación Banda Industrial</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:#1e1e1e;
}

#panel{
position:absolute;
top:20px;
left:20px;
background:white;
padding:10px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<div id="panel">
<b>Banda Transportadora Industrial</b><br>
Piezas detectadas: <span id="counter">0</span>
</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

let scene,camera,renderer;

let piezas = [];
let contador = 0;
let sensorX = 2;

let beltTexture;

init();
animate();

function init(){

scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(
70,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(8,6,10);
camera.lookAt(0,0,0);

renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener("resize",resize);

// luces

const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,10,10);

scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff,0.5));

// piso

const floorGeo = new THREE.PlaneGeometry(50,50);
const floorMat = new THREE.MeshStandardMaterial({color:0x555555});

const floor = new THREE.Mesh(floorGeo,floorMat);

floor.rotation.x = -Math.PI/2;

scene.add(floor);

// estructura banda

crearEstructura();

// cinta

crearBanda();

// rodillos

for(let i=-4.5;i<=4.5;i+=1.5){

crearRodillo(i)

}

// patas

crearPata(-4)
crearPata(4)

// sensor

crearSensor()

// piezas

setInterval(crearPieza,2000)

}

function crearEstructura(){

const geo = new THREE.BoxGeometry(10,0.5,2.2)
const mat = new THREE.MeshStandardMaterial({color:0x444444})

const frame = new THREE.Mesh(geo,mat)

scene.add(frame)

}

function crearBanda(){

beltTexture = crearTexturaBanda()

beltTexture.wrapS = THREE.RepeatWrapping
beltTexture.repeat.set(8,1)

const geo = new THREE.BoxGeometry(10,0.15,1.8)

const mat = new THREE.MeshStandardMaterial({
map: beltTexture
})

const belt = new THREE.Mesh(geo,mat)

belt.position.y = 0.4

scene.add(belt)

}

function crearRodillo(x){

const geo = new THREE.CylinderGeometry(0.25,0.25,1.9,32)

const mat = new THREE.MeshStandardMaterial({
color:0xaaaaaa,
metalness:0.8,
roughness:0.3
})

const roller = new THREE.Mesh(geo,mat)

roller.rotation.z = Math.PI/2

roller.position.set(x,0.4,0)

scene.add(roller)

}

function crearPata(x){

const geo = new THREE.BoxGeometry(0.3,2,0.3)

const mat = new THREE.MeshStandardMaterial({
color:0x666666
})

const leg = new THREE.Mesh(geo,mat)

leg.position.set(x,-1,0)

scene.add(leg)

}

function crearSensor(){

const geo = new THREE.BoxGeometry(0.3,0.5,0.5)

const mat = new THREE.MeshStandardMaterial({
color:0xff3333,
emissive:0x220000
})

const sensor = new THREE.Mesh(geo,mat)

sensor.position.set(sensorX,0.9,0)

scene.add(sensor)

}

function crearPieza(){

const geo = new THREE.BoxGeometry(0.6,0.6,0.6)

const mat = new THREE.MeshStandardMaterial({
color:0xffaa00
})

const pieza = new THREE.Mesh(geo,mat)

pieza.position.set(-4.5,0.8,0)

pieza.userData.detectada = false

scene.add(pieza)

piezas.push(pieza)

}

function crearTexturaBanda(){

const canvas = document.createElement("canvas")
canvas.width = 256
canvas.height = 64

const ctx = canvas.getContext("2d")

ctx.fillStyle="#222"
ctx.fillRect(0,0,256,64)

ctx.strokeStyle="#555"

for(let i=0;i<256;i+=32){

ctx.beginPath()
ctx.moveTo(i,0)
ctx.lineTo(i,64)
ctx.stroke()

}

return new THREE.CanvasTexture(canvas)

}

function animate(){

requestAnimationFrame(animate)

// mover textura cinta

beltTexture.offset.x -= 0.02

// mover piezas

piezas.forEach(p=>{

p.position.x += 0.03

// sensor

if(!p.userData.detectada && Math.abs(p.position.x-sensorX)<0.1){

p.userData.detectada=true

contador++

document.getElementById("counter").innerText = contador

console.log("pieza detectada")

}

// eliminar pieza

if(p.position.x>5){

scene.remove(p)

}

})

renderer.render(scene,camera)

}

function resize(){

camera.aspect = window.innerWidth/window.innerHeight
camera.updateProjectionMatrix()

renderer.setSize(window.innerWidth,window.innerHeight)

}

</script>

</body>
</html>
