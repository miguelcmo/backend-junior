<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editor Fábrica IoT</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial;
}

#panel{
position:absolute;
top:20px;
left:20px;
background:white;
padding:10px;
border-radius:6px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

#config{
position:absolute;
bottom:20px;
left:20px;
background:white;
padding:10px;
border-radius:6px;
display:none;
}

</style>
</head>

<body>

<div id="panel">
<b>Editor de Sensores</b><br>
Click sobre la banda para colocar sensores
</div>

<div id="config">
Sensor seleccionado<br>
Frecuencia(ms): <input id="freq" value="1000"><br>
<button onclick="guardarConfig()">Guardar</button>
</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

let scene,camera,renderer;
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();

let sensores = [];
let sensorSeleccionado = null;
let banda;

init();
animate();

function init(){

scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f0f0);

camera = new THREE.PerspectiveCamera(
70,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(6,5,10);
camera.lookAt(0,0,0);

renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener("resize",resize);
window.addEventListener("click",clickScene);

scene.add(new THREE.AmbientLight(0xffffff,0.6));

const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,10,10);
scene.add(light);

// piso

const floorGeo = new THREE.PlaneGeometry(50,50);
const floorMat = new THREE.MeshStandardMaterial({color:0xdddddd});

const floor = new THREE.Mesh(floorGeo,floorMat);
floor.rotation.x = -Math.PI/2;

scene.add(floor);

// banda

const geo = new THREE.BoxGeometry(10,0.4,2);
const mat = new THREE.MeshStandardMaterial({color:0x444444});

banda = new THREE.Mesh(geo,mat);

scene.add(banda);

}

function clickScene(event){

mouse.x = (event.clientX/window.innerWidth)*2-1;
mouse.y = -(event.clientY/window.innerHeight)*2+1;

raycaster.setFromCamera(mouse,camera);

const intersects = raycaster.intersectObjects(scene.children);

if(intersects.length===0) return;

const obj = intersects[0].object;

// si es banda -> crear sensor

if(obj === banda){

crearSensor(intersects[0].point);

}

// si es sensor -> abrir config

if(obj.userData.tipo === "sensor"){

sensorSeleccionado = obj;

document.getElementById("config").style.display="block";

document.getElementById("freq").value = obj.userData.freq;

}

}

function crearSensor(pos){

const geo = new THREE.BoxGeometry(0.3,0.3,0.3);
const mat = new THREE.MeshStandardMaterial({color:0xff0000});

const sensor = new THREE.Mesh(geo,mat);

sensor.position.copy(pos);
sensor.position.y = 0.6;

sensor.userData = {

tipo:"sensor",
freq:1000,
id:"sensor_"+sensores.length

};

scene.add(sensor);

sensores.push(sensor);

}

window.guardarConfig = function(){

if(!sensorSeleccionado) return;

sensorSeleccionado.userData.freq =
parseInt(document.getElementById("freq").value);

alert("configuracion guardada");

}

function animate(){

requestAnimationFrame(animate);

renderer.render(scene,camera);

}

function resize(){

camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);

}

</script>

</body>
</html>
