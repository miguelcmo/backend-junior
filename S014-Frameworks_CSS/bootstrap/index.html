<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Demo</title>
    <!-- CDN - Content Delivery Network -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- <link rel="stylesheet" href="styles.css"> -->
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">MySite</a>
        </div>
    </nav>

    <!-- Hero -->
    <section class="bg-light text-center py-5">
        <div class="container">
            <h1 class="display-1">Welcome</h1>
            <p class="lead">This layout is built with Bootstrap.</p>
            <button class="btn btn-outline-primary">Learn More</button>
        </div>
    </section>

    <!-- Cards -->
    <section class="py-5"> <!-- padding en y -->
        <div class="container">
            <div class="row g-4">

                <div class="col-sm-6 col-md-4">
                    <div class="card shadow">
                        <div class="card-body">
                            <h5 class="card-title">Card One</h5>
                            <p class="card-text">Bootstrap card component.</p>
                        </div>
                    </div>
                </div>

                <div class="col-sm-6 col-md-4">
                    <div class="card shadow">
                        <div class="card-body">
                            <h5 class="card-title">Card Two</h5>
                            <p class="card-text">Responsive grid system.</p>
                        </div>
                    </div>
                </div>

                <div class="col-sm-6 col-md-4">
                    <div class="card shadow">
                        <div class="card-body">
                            <h5 class="card-title">Card Three</h5>
                            <p class="card-text">Ready-made components.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p>© 2026 MySite</p>
    </footer>

    <!-- scripts de css de js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>

</html>
