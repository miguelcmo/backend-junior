<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Demo</title>
  <!-- <link rel="stylesheet" href="src/style.css"> -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

<!-- Navbar -->
<nav class="bg-gray-900 text-white">
  <div class="max-w-6xl mx-auto px-4 py-4">
    <h1 class="text-xl font-bold">MySite</h1>
  </div>
</nav>

<!-- Hero -->
<section class="text-center py-16 bg-gray-100">
  <h1 class="text-4xl font-bold mb-4">Welcome</h1>
  <p class="text-gray-600 mb-6">This layout is built with Tailwind.</p>
  <button class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">
    Learn More
  </button>
</section>

<!-- Cards -->
<section class="py-16">
  <div class="max-w-6xl mx-auto px-4">
    <div class="grid md:grid-cols-3 sm:grid-cols-2 gap-6">

      <div class="bg-white p-6 rounded shadow">
        <h3 class="font-semibold text-lg mb-2">Card One</h3>
        <p class="text-gray-600">Utility-first styling.</p>
      </div>

      <div class="bg-white p-6 rounded shadow">
        <h3 class="font-semibold text-lg mb-2">Card Two</h3>
        <p class="text-gray-600">Highly customizable UI.</p>
      </div>

      <div class="bg-white p-6 rounded shadow">
        <h3 class="font-semibold text-lg mb-2">Card Three</h3>
        <p class="text-gray-600">Modern design workflow.</p>
      </div>

    </div>
  </div>
</section>



<!-- Footer -->
<footer class="bg-gray-900 text-white text-center py-4">
  <p>© 2026 MySite</p>
</footer>

</body>
</html>
